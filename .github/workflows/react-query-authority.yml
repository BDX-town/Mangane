name: React Query authority

on:
  pull_request:
    paths:
      - 'app/**'
      - 'config/react-query-authority-inventory.json'
      - 'docs/architecture/REACT_QUERY_AUTHORITY_DRIFT_GATE.md'
      - 'scripts/check-react-query-authority-inventory.js'
      - 'scripts/__tests__/check-react-query-authority-inventory.test.js'
      - '.github/workflows/react-query-authority.yml'
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'config/react-query-authority-inventory.json'
      - 'docs/architecture/REACT_QUERY_AUTHORITY_DRIFT_GATE.md'
      - 'scripts/check-react-query-authority-inventory.js'
      - 'scripts/__tests__/check-react-query-authority-inventory.test.js'
      - '.github/workflows/react-query-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-query-authority-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify bounded React Query authority inventory
        run: node scripts/check-react-query-authority-inventory.js
      - name: Run focused React Query authority tests
        run: node --test scripts/__tests__/check-react-query-authority-inventory.test.js
