name: Draft Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  draft-release:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}

    - id: set_var
      run: |
          content=`cat ./package.json`
          # the following lines are only required for multi line json
          content="${content//'%'/'%25'}"
          content="${content//$'\n'/'%0A'}"
          content="${content//$'\r'/'%0D'}"
          # end of optional handling for multi line json
          echo "::set-output name=packageJson::$content"

    - name: Extract changelog for this version
      id: changelog
      run: |
          VERSION="${{ fromJson(steps.set_var.outputs.packageJson).version }}"
          awk -v ver="$VERSION" '
            index($0, "## ") == 1 {
              if (incurrent) exit
              if (index($0, "## " ver " (") == 1) incurrent = 1
              next
            }
            incurrent {
              if (!started && $0 ~ /^[ \t]*$/) next
              started = 1
              print
            }
          ' CHANGELOG.md > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "No notable changes." > release_notes.md
          fi

          {
            echo "notes<<EOF"
            cat release_notes.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

    - name: Build
      run: |
        git config --global core.autocrlf false
        corepack enable
        npx yarn
        export NODE_ENV=production
        yarn build
        mv static dist
        zip -r static.zip dist

    - name: Create or replace draft release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="${{ github.ref_name }}"

        if gh release view "$TAG" >/dev/null 2>&1; then
          IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq '.isDraft')
          if [ "$IS_DRAFT" = "true" ]; then
            gh release delete "$TAG" --yes
          else
            echo "Release $TAG is already published, leaving it untouched."
            exit 0
          fi
        fi

        gh release create "$TAG" \
          --draft \
          --title "$TAG" \
          --notes-file release_notes.md \
          ./static.zip
