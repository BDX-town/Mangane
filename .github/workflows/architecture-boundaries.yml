name: Architecture boundaries

on:
  pull_request:
    paths:
      - 'app/soapbox/application/**'
      - 'app/soapbox/actions/accounts.ts'
      - 'app/soapbox/build_config.js'
      - 'app/soapbox/domain/**'
      - 'app/soapbox/infrastructure/**'
      - 'app/soapbox/runtime/**'
      - 'app/soapbox/components/**'
      - 'app/soapbox/containers/**'
      - 'app/soapbox/features/**'
      - 'app/soapbox/pages/**'
      - 'config/architecture-boundary-inventory.json'
      - 'config/typecheck-baseline.json'
      - 'scripts/architecture-boundary-lib.js'
      - 'scripts/check-architecture-boundaries.js'
      - 'scripts/generate-architecture-boundary-inventory.js'
      - 'scripts/check-typecheck-baseline.js'
      - 'scripts/__tests__/check-architecture-boundaries.test.js'
      - 'scripts/__tests__/build-config-feature-flags.test.js'
      - 'tsconfig.typecheck.json'
      - 'package.json'
      - '.github/workflows/architecture-boundaries.yml'
  push:
    branches: [main]
    paths:
      - 'app/soapbox/application/**'
      - 'app/soapbox/actions/accounts.ts'
      - 'app/soapbox/build_config.js'
      - 'app/soapbox/domain/**'
      - 'app/soapbox/infrastructure/**'
      - 'app/soapbox/runtime/**'
      - 'app/soapbox/components/**'
      - 'app/soapbox/containers/**'
      - 'app/soapbox/features/**'
      - 'app/soapbox/pages/**'
      - 'config/architecture-boundary-inventory.json'
      - 'config/typecheck-baseline.json'
      - 'scripts/architecture-boundary-lib.js'
      - 'scripts/check-architecture-boundaries.js'
      - 'scripts/generate-architecture-boundary-inventory.js'
      - 'scripts/check-typecheck-baseline.js'
      - 'scripts/__tests__/check-architecture-boundaries.test.js'
      - 'scripts/__tests__/build-config-feature-flags.test.js'
      - 'tsconfig.typecheck.json'
      - 'package.json'
      - '.github/workflows/architecture-boundaries.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-boundaries-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Contracts and presentation drift / architecture-maintainers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '18.20.8'
      - run: corepack enable
      - run: yarn install --immutable --mode=skip-build
      - run: yarn typecheck
      - run: yarn check:architecture-boundaries
      - run: yarn test:architecture-boundaries
