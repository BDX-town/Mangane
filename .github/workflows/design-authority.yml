name: Design and accessibility authority

on:
  pull_request:
    paths:
      - 'app/soapbox/components/**'
      - 'app/soapbox/containers/**'
      - 'app/soapbox/features/**'
      - 'app/soapbox/pages/**'
      - 'app/styles/**'
      - 'config/component-ownership-manifest.json'
      - 'config/design-component-authority-inventory.json'
      - 'config/design-tokens.json'
      - 'docs/architecture/**'
      - 'scripts/**design**'
      - 'scripts/**token**'
      - 'scripts/__tests__/check-design-component-authority-inventory.test.js'
      - 'tailwind/**'
      - 'tailwind.config.js'
      - 'package.json'
      - '.github/workflows/design-authority.yml'
  push:
    branches: [develop]
    paths:
      - 'app/soapbox/components/**'
      - 'app/soapbox/containers/**'
      - 'app/soapbox/features/**'
      - 'app/soapbox/pages/**'
      - 'app/styles/**'
      - 'config/component-ownership-manifest.json'
      - 'config/design-component-authority-inventory.json'
      - 'config/design-tokens.json'
      - 'scripts/**design**'
      - 'scripts/**token**'
      - 'tailwind/**'
      - 'tailwind.config.js'

permissions:
  contents: read

jobs:
  design-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Verify design, component, icon, interaction, and accessibility authority
        run: node scripts/check-design-component-authority-inventory.js
      - name: Run authority mutation tests
        run: node --test scripts/__tests__/check-design-component-authority-inventory.test.js
      - name: Verify semantic design tokens and compatibility aliases
        run: node scripts/check-design-tokens.js
      - name: Run design token contract tests
        run: node --test scripts/__tests__/design-token-foundation.test.js
