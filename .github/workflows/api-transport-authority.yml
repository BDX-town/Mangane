name: API transport authority

on:
  pull_request:
    paths:
      - 'app/soapbox/api.ts'
      - 'app/soapbox/utils/auth.ts'
      - 'config/api-transport-authority-inventory.json'
      - 'scripts/check-api-transport-authority-inventory.js'
      - 'scripts/__tests__/check-api-transport-authority-inventory.test.js'
      - '.github/workflows/api-transport-authority.yml'
  push:
    branches:
      - main
    paths:
      - 'app/soapbox/api.ts'
      - 'app/soapbox/utils/auth.ts'
      - 'config/api-transport-authority-inventory.json'
      - 'scripts/check-api-transport-authority-inventory.js'
      - 'scripts/__tests__/check-api-transport-authority-inventory.test.js'
      - '.github/workflows/api-transport-authority.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-transport-authority-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify bounded API transport authority inventory
        run: node scripts/check-api-transport-authority-inventory.js
      - name: Run focused API transport authority tests
        run: node --test scripts/__tests__/check-api-transport-authority-inventory.test.js
