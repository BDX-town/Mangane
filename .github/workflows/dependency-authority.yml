name: Dependency authority

on:
  pull_request:
    paths:
      - 'package.json'
      - 'yarn.lock'
      - 'config/dependency-advisory-snapshot.json'
      - 'config/dependency-authority-inventory.json'
      - 'docs/architecture/ADVISORY_DISPOSITION_REGISTER.md'
      - 'docs/architecture/DEPENDENCY_AND_LICENSE_INVENTORY.md'
      - 'docs/architecture/DEPENDENCY_REPLACEMENT_QUEUE.md'
      - 'scripts/check-dependency-authority-inventory.js'
      - 'scripts/check-live-dependency-advisories.js'
      - 'scripts/dependency-inventory-lib.js'
      - 'scripts/generate-dependency-authority-inventory.js'
      - 'scripts/__tests__/check-dependency-authority-inventory.test.js'
      - '.github/workflows/**'
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'yarn.lock'
      - 'config/dependency-advisory-snapshot.json'
      - 'config/dependency-authority-inventory.json'
      - 'docs/architecture/ADVISORY_DISPOSITION_REGISTER.md'
      - 'docs/architecture/DEPENDENCY_AND_LICENSE_INVENTORY.md'
      - 'docs/architecture/DEPENDENCY_REPLACEMENT_QUEUE.md'
      - 'scripts/check-dependency-authority-inventory.js'
      - 'scripts/check-live-dependency-advisories.js'
      - 'scripts/dependency-inventory-lib.js'
      - 'scripts/generate-dependency-authority-inventory.js'
      - 'scripts/__tests__/check-dependency-authority-inventory.test.js'
      - '.github/workflows/**'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-authority-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Use the audited Node.js runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '18.20.8'
      - name: Enable repository-pinned Yarn
        run: corepack enable
      - name: Install without executing dependency or repository build scripts
        run: yarn install --immutable --mode=skip-build
      - name: Verify dependency, license, action, and disposition authority
        run: yarn check:dependencies
      - name: Run dependency authority mutation tests
        run: yarn test:dependency-inventory
      - name: Query current npm advisories
        shell: bash
        run: |
          set -euo pipefail
          set +e
          yarn npm audit --recursive --all --json > "$RUNNER_TEMP/mangane-audit.jsonl"
          audit_status=$?
          set -e
          if [[ "$audit_status" -ne 0 && "$audit_status" -ne 1 ]]; then
            exit "$audit_status"
          fi
          node scripts/check-live-dependency-advisories.js "$RUNNER_TEMP/mangane-audit.jsonl"
