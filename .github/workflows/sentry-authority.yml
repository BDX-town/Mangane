name: Telemetry and redaction authority

on:
  pull_request:
    paths:
      - 'package.json'
      - 'yarn.lock'
      - 'app/**'
      - 'webpack/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'config/sentry-authority-inventory.json'
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'yarn.lock'
      - 'app/**'
      - 'webpack/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'config/sentry-authority-inventory.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify complete telemetry and redaction authority
        run: node scripts/check-sentry-authority-inventory.js
      - name: Run telemetry authority mutation tests
        run: node --test scripts/__tests__/check-sentry-authority-inventory.test.js
      - name: Enable Corepack
        run: corepack enable
      - name: Install pinned dependencies
        run: yarn install --immutable --mode=skip-build
      - name: Run adversarial secret-leak tests
        run: yarn jest app/soapbox/utils/__tests__/diagnostics.test.ts --runInBand
